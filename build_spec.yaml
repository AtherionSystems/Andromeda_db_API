version: 0.1
component: build
timeoutInSeconds: 600

env:
  variables:
    REGION: "mx-queretaro-1"
    TENANCY_NAMESPACE: "axieboiigznv"
    IMAGE_NAME: "andromeda-backend"
    NAMESPACE: "andromeda"
    CLUSTER_ID: "ocid1.cluster.oc1.mx-queretaro-1.aaaaaaaa4itexmvxmqsixz3xyoyokcsttqvrbfhegdbu6p7axcw32fci7h2a"
  exportedVariables:
    - IMAGE_TAG
    - TARGET_SLOT

steps:
  - type: Command
    name: "Set image tag"
    timeoutInSeconds: 30
    command: |
      COMMIT_HASH=$(git -C /workspace/GitHubConn rev-parse --short HEAD 2>/dev/null || echo "noref")
      BUILD_DATE=$(date +%Y%m%d)
      SLOT="${TARGET_SLOT:-green}"
      export IMAGE_TAG="${SLOT}-${BUILD_DATE}-${COMMIT_HASH}"
      export TARGET_SLOT="${SLOT}"
      echo "IMAGE_TAG=$IMAGE_TAG"
      echo "TARGET_SLOT=$TARGET_SLOT"

  - type: Command
    name: "Docker login to OCIR"
    timeoutInSeconds: 60
    command: |
      echo "${AUTH_TOKEN}" | docker login ${REGION}.ocir.io \
        --username "${TENANCY_NAMESPACE}/a01571222@tec.mx" \
        --password-stdin

  - type: Command
    name: "Build Docker image"
    timeoutInSeconds: 400
    command: |
      docker build \
        -t ${REGION}.ocir.io/${TENANCY_NAMESPACE}/${IMAGE_NAME}:${IMAGE_TAG} \
        -f /workspace/GitHubConn/Dockerfile \
        /workspace/GitHubConn

  - type: Command
    name: "Push image to OCIR"
    timeoutInSeconds: 120
    command: |
      docker push ${REGION}.ocir.io/${TENANCY_NAMESPACE}/${IMAGE_NAME}:${IMAGE_TAG}
      echo "Pushed: ${REGION}.ocir.io/${TENANCY_NAMESPACE}/${IMAGE_NAME}:${IMAGE_TAG}"

  - type: Command
    name: "Configure kubectl"
    timeoutInSeconds: 60
    command: |
      oci ce cluster create-kubeconfig \
        --cluster-id ${CLUSTER_ID} \
        --file $HOME/.kube/config \
        --region ${REGION} \
        --token-version 2.0.0 \
        --kube-endpoint PUBLIC_ENDPOINT
      kubectl cluster-info

  - type: Command
    name: "Update image on inactive slot"
    timeoutInSeconds: 120
    command: |
      SLOT="${TARGET_SLOT:-green}"
      IMAGE="${REGION}.ocir.io/${TENANCY_NAMESPACE}/${IMAGE_NAME}:${IMAGE_TAG}"
      echo "Setting image on slot: ${SLOT} → ${IMAGE}"
      kubectl set image deployment/andromeda-${SLOT} \
        andromeda=${IMAGE} \
        -n ${NAMESPACE}
      kubectl rollout status deployment/andromeda-${SLOT} \
        -n ${NAMESPACE} \
        --timeout=120s
      echo "Rollout complete on slot: ${SLOT}"