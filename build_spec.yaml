version: 0.1
component: build
timeoutInSeconds: 600

# Pipeline parameters (set in OCI DevOps → Pipeline Parameters):
#   TARGET_SLOT  — "blue" or "green" (required, no default)
#
# These are passed automatically by the Deployment Pipeline trigger.
# When running manually, set TARGET_SLOT in the pipeline run form.

env:
  variables:
    REGION: "mx-queretaro-1"
    TENANCY_NAMESPACE: "axieboiigznv"
    IMAGE_NAME: "andromeda-backend"
  exportedVariables:
    - IMAGE_TAG
    - TARGET_SLOT

steps:
  - type: Command
    name: "Set image tag"
    timeoutInSeconds: 30
    command: |
      COMMIT_HASH=$(echo "${OCI_BUILD_RUN_COMMIT_HASH}" | cut -c1-7)
      BUILD_DATE=$(date +%Y%m%d)
      export IMAGE_TAG="${TARGET_SLOT}-${BUILD_DATE}-${COMMIT_HASH}"
      echo "IMAGE_TAG=$IMAGE_TAG"
      echo "TARGET_SLOT=$TARGET_SLOT"

  - type: Command
    name: "Docker login to OCIR"
    timeoutInSeconds: 60
    command: |
      echo "${OCIR_AUTH_TOKEN}" | docker login \
        ${REGION}.ocir.io \
        --username "${TENANCY_NAMESPACE}/a01571222@tec.mx" \
        --password-stdin

  - type: Command
    name: "Build Docker image"
    timeoutInSeconds: 400
    command: |
      docker build \
        -t ${REGION}.ocir.io/${TENANCY_NAMESPACE}/${IMAGE_NAME}:${IMAGE_TAG} \
        -f MtdrSpring/backend/Dockerfile \
        MtdrSpring/backend

  - type: Command
    name: "Push image to OCIR"
    timeoutInSeconds: 120
    command: |
      docker push ${REGION}.ocir.io/${TENANCY_NAMESPACE}/${IMAGE_NAME}:${IMAGE_TAG}
      echo "Pushed: ${REGION}.ocir.io/${TENANCY_NAMESPACE}/${IMAGE_NAME}:${IMAGE_TAG}"

outputArtifacts:
  - name: andromeda_image_tag
    type: BINARY
    location: /tmp/image_tag.txt